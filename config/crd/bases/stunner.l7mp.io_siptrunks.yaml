---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: siptrunks.stunner.l7mp.io
spec:
  group: stunner.l7mp.io
  names:
    categories:
    - stunner
    kind: SIPTrunk
    listKind: SIPTrunkList
    plural: siptrunks
    singular: siptrunk
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mediaListener
      name: Media
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SIPTrunk names the listener of a Gateway carrying the media, and tells how the carriers
          connect. SIP Gateways can reference a SIPTrunk in spec.infrastructure.parametersRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SIPTrunkSpec is the spec of a SIPTrunk.
            properties:
              allowedSources:
                description: |-
                  AllowedSources are the address prefixes the SIP listeners admit calls from. Empty admits no
                  inbound calls, which suits registration-only trunks.
                items:
                  type: string
                type: array
              mediaListener:
                description: |-
                  MediaListener is the name of the Gateway listener carrying the media of the calls. Every
                  other listener of the Gateway is a SIP listener.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              registrations:
                description: Registrations are the registrations the gateway keeps
                  up with registration trunks.
                items:
                  description: SIPRegistration is a registration of an address of
                    record with a carrier's registrar.
                  properties:
                    aor:
                      description: 'AOR is the address of record to register, a sip:
                        or sips: URI.'
                      minLength: 1
                      type: string
                    authRef:
                      description: |-
                        AuthRef names a Secret in the namespace of the SIPTrunk whose username and password keys
                        answer the registrar's digest challenge.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    expires:
                      default: 600s
                      description: Expires is the registration lifetime the gateway
                        asks for.
                      type: string
                    name:
                      description: |-
                        Name of the registration, unique in the SIPTrunk and distinct from the listener names of
                        the Gateway. A route attaches to the registration by this name as its sectionName: its
                        backends take the calls of the registration, so the name is a valid sectionName.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    registrar:
                      description: |-
                        Registrar is the SIP URI of the carrier's registrar, as Kamailio or Asterisk names one:
                        sip:host[:port][;transport=udp|tcp|tls], or sips:host[:port] for TLS; the scheme may be
                        omitted for sip:. The transport defaults to UDP, TLS for sips:, the port to 5060, 5061 over
                        TLS.
                      minLength: 1
                      type: string
                  required:
                  - aor
                  - name
                  - registrar
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - mediaListener
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
