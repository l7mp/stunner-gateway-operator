name: Test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
    tags-ignore:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Golang Environment
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Run Tests
        run: make test
  sec-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check security vulnerabilites
        uses: anchore/scan-action@v7
        with:
          path: "."
          fail-build: true
          severity-cutoff: critical

  # The official images are built in the private workspace from the heads of the OSS repos: a
  # tested push to main starts that build. PRIV_WORKSPACE_TOKEN is a fine-grained token limited
  # to l7mp/priv-workspace.
  notify-priv-workspace:
    name: Start the private workspace build
    needs: [unit-tests, sec-check]
    if: github.repository == 'l7mp/stunner-gateway-operator' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PRIV_WORKSPACE_TOKEN }}
          repository: l7mp/priv-workspace
          event-type: oss-push
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
